name: Update stats card

on:
  push:
    branches: [main]
  schedule:
    # Once a day. GitHub stats don't move fast enough to need more.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions: {}

# Two runs at once would race to push the same file.
concurrency:
  group: stats-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test build.js
        run: npm test

      - name: Draw card.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: trev-delivers
        run: node build.js

      - name: Commit and push if anything changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update stats card"
          # Another push can land between checkout and here. The bot only
          # touches card.svg and the README's alt text, so rebasing onto it
          # is safe. If every try fails, the job fails, so a stale card
          # never sits behind a green tick.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            git fetch origin main
            git rebase origin/main
          done
          echo "Couldn't push the card after 3 tries"
          exit 1

      # Last, so the card still updates when obvious has moved on. The job
      # goes red until someone runs node scripts/sync-ds.mjs and commits ds/.
      - name: Check ds/ matches obvious
        run: node scripts/sync-ds.mjs --check
