name: Update stats card

on:
  push:
    branches: [main]
  schedule:
    # Once a day — GitHub stats don't move fast enough to need more,
    # and it keeps this off everyone's Actions minutes unnecessarily.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render card.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: trev-delivers
        run: node build.js

      - name: Commit card.svg if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg
          git diff --cached --quiet && echo "No changes" || git commit -m "Update stats card"
          git push
