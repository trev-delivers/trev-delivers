name: Update stats card

on:
  push:
    branches: [main]
  schedule:
    # Once a day — GitHub stats don't move fast enough to need more,
    # and it keeps this off everyone's Actions minutes unnecessarily.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render card.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: trev-delivers
        run: node build.js

      - name: Commit card.svg if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update stats card"
          # A push right as the daily cron fires (or two manual runs
          # close together) can race and get rejected as non-fast-
          # forward — card.svg is the only thing this workflow ever
          # touches, so rebasing onto whatever landed in between is
          # always safe: there's nothing meaningful to conflict with,
          # just a newer version of the same generated file.
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git rebase origin/main
          done
