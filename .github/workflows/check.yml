name: check
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # obvious is private. With a read-only key in OBVIOUS_TOKEN, git can
      # fetch it for the ds/ check.
      - name: Let git read obvious
        env:
          OBVIOUS_TOKEN: ${{ secrets.OBVIOUS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$OBVIOUS_TOKEN" ]; then
            git config --global url."https://x-access-token:${OBVIOUS_TOKEN}@github.com/trev-delivers/obvious".insteadOf "https://github.com/trev-delivers/obvious"
          else
            echo "OBVIOUS_TOKEN isn't set, so obvious can only be fetched while it's public."
          fi
      - run: npm run check
