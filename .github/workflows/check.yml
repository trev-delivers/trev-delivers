name: check
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # obvious may be private. With a read-only key in OBVIOUS_TOKEN, git sends
      # it as a header for this one step only (git reads these variables as
      # per-command config), so it never lands in a git config file.
      - name: Run the checks
        env:
          OBVIOUS_TOKEN: ${{ secrets.OBVIOUS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$OBVIOUS_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/trev-delivers/obvious.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$OBVIOUS_TOKEN" | base64 -w0)"
          else
            echo "OBVIOUS_TOKEN isn't set, so obvious can only be fetched while it's public."
          fi
          npm run check
